<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found | Unfollow Finder</title>
<meta name="description" content="That page doesn't exist. Find out who unfollowed you on Instagram with Unfollow Finder.">
<meta name="robots" content="noindex, follow">
<link rel="icon" href="/favicon/favicon.png" type="image/png">
<link rel="stylesheet" href="/style.css">
<style>
  .nf-wrap{min-height:70vh;display:flex;align-items:center;justify-content:center;padding:80px 20px}
  .nf{max-width:560px;text-align:center}
  .nf-code{font-size:14px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#e1306c;margin-bottom:16px}
  .nf h1{font-size:clamp(28px,5vw,40px);line-height:1.15;margin:0 0 14px}
  .nf p{color:#555;font-size:17px;line-height:1.6;margin:0 0 28px}
  .nf-links{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .nf-links a{display:inline-block;padding:12px 22px;border-radius:999px;text-decoration:none;font-weight:600;font-size:15px}
  .nf-primary{background:#e1306c;color:#fff}
  .nf-secondary{background:#f1f1f4;color:#222}
  @media (prefers-color-scheme:dark){.nf p{color:#aaa}.nf-secondary{background:#222;color:#eee}}
</style>
</head>
<body>
<div class="nf-wrap">
  <div class="nf">
    <div class="nf-code">Error 404</div>
    <h1>We couldn't find that page</h1>
    <p>The link may be out of date, or the address might have a typo in it. The tool is still where you left it.</p>
    <div class="nf-links">
      <a class="nf-primary" href="/">Check your unfollowers</a>
      <a class="nf-secondary" href="/blogs/">Read the guides</a>
    </div>
  </div>
</div>
</body>
</html>
